name: one-time-ci-regex-fix
on:
  push:
    branches: [fix/ci-regex-syntax]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix invalid escaped regex literals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
            Path("src/components/PedagogicalNoteModal.tsx"),
            Path("src/services/geminiPedagogicalService.ts"),
          ]
          for path in files:
            s = path.read_text(encoding="utf-8")
            s2 = s.replace(r"/^https?:\\/\\//i", r"/^https?:\/\//i")
            if s2 == s:
              raise SystemExit(f"No target regex found in {path}")
            path.write_text(s2, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PedagogicalNoteModal.tsx src/services/geminiPedagogicalService.ts
          git commit -m "fix: correct escaped URL validation regexes"
          git push
