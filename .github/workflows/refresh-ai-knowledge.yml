name: Refresh AI knowledge

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh knowledge from web
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: node scripts/refresh-ai-knowledge.mjs

      - name: Commit refreshed knowledge
        run: |
          if git diff --quiet -- data/aiKnowledge.json; then
            echo "No knowledge changes."
            exit 0
          fi
          git config user.name "AI Knowledge Refresh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aiKnowledge.json
          git commit -m "chore: refresh AI knowledge"
          git push
